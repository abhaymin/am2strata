<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" font-family="Outfit, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Bigger than your RAM: how am2Strata runs a model that does not fit</title>
  <desc id="d">Three tiers. The weights every token uses and the hottest experts sit in GPU memory or RAM; the experts a learned profile ranks hot are kept resident in RAM; the cold experts stay on the SSD and are read in parallel only when the router picks them. Measured on a Mac mini M4 with 16 GB running GLM-4.7-Flash (17.5 GB): am2Strata generates 8.9 tokens per second without swapping, llama.cpp 3.6 with plain mmap and 2.05 by default while writing about 98 GB of swap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1326"/><stop offset="1" stop-color="#101c38"/></linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="1600" height="960" rx="28" fill="url(#bg)"/>
  <text x="64" y="92" font-size="46" font-weight="700" fill="#eef3f8">Bigger than your RAM</text>
  <text x="64" y="134" font-size="22" fill="#a7b6c8">A mixture-of-experts model uses only a few experts per token. am2Strata keeps those close and leaves the rest on the SSD.</text>

  <!-- the three tiers, drawn as stacked slabs -->
  <g transform="translate(64 190)">
    <g>
      <path d="M40 0 H600 L640 34 H80 Z" fill="#5eead4" opacity=".22"/>
      <rect x="40" y="34" width="600" height="118" rx="14" fill="#0f2a33" stroke="url(#l1)" stroke-width="2.5"/>
      <rect x="40" y="34" width="10" height="118" rx="4" fill="url(#l1)"/>
      <text x="72" y="74" font-size="26" font-weight="700" fill="#eef3f8">GPU memory and RAM</text>
      <text x="72" y="106" font-size="19" fill="#a7b6c8">Attention, shared experts, the output head:</text>
      <text x="72" y="132" font-size="19" fill="#a7b6c8">the weights every token uses, always resident</text>
    </g>
    <g transform="translate(0 176)">
      <path d="M40 0 H600 L640 34 H80 Z" fill="#60a5fa" opacity=".2"/>
      <rect x="40" y="34" width="600" height="118" rx="14" fill="#13213f" stroke="url(#l2)" stroke-width="2.5"/>
      <rect x="40" y="34" width="10" height="118" rx="4" fill="url(#l2)"/>
      <text x="72" y="74" font-size="26" font-weight="700" fill="#eef3f8">Hot experts in RAM</text>
      <text x="72" y="106" font-size="19" fill="#a7b6c8">A learned profile ranks them; they are pinned so</text>
      <text x="72" y="132" font-size="19" fill="#a7b6c8">the OS cannot evict them (98% of routing hits here)</text>
    </g>
    <g transform="translate(0 352)">
      <path d="M40 0 H600 L640 34 H80 Z" fill="#a78bfa" opacity=".2"/>
      <rect x="40" y="34" width="600" height="118" rx="14" fill="#1c1a3d" stroke="url(#l3)" stroke-width="2.5"/>
      <rect x="40" y="34" width="10" height="118" rx="4" fill="url(#l3)"/>
      <text x="72" y="74" font-size="26" font-weight="700" fill="#eef3f8">Cold experts on the SSD</text>
      <text x="72" y="106" font-size="19" fill="#a7b6c8">Read only when the router picks them: all of a</text>
      <text x="72" y="132" font-size="19" fill="#a7b6c8">step's experts at once, in parallel, megabytes each</text>
    </g>
    <path d="M668 480 C 712 420, 712 250, 668 190" fill="none" stroke="#5eead4" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#up)"/>
    <text x="736" y="342" font-size="17" fill="#5eead4" transform="rotate(-90 736 342)" text-anchor="middle">promoted when they heat up</text>
    <g transform="translate(40 556)">
      <text x="0" y="0" font-size="19" fill="#a7b6c8">Prompts go in chunks: each chunk's tokens are grouped by expert,</text>
      <text x="0" y="28" font-size="19" fill="#a7b6c8">so an expert is read once per chunk, not once per token.</text>
    </g>
  </g>

  <!-- the measurement -->
  <g transform="translate(860 190)">
    <rect x="0" y="0" width="676" height="660" rx="22" fill="#0e1830" stroke="#23314f" stroke-width="2"/>
    <text x="36" y="54" font-size="26" font-weight="700" fill="#eef3f8">Measured: a 17.5 GB model on a 16 GB Mac</text>
    <text x="36" y="86" font-size="18" fill="#a7b6c8">Mac mini M4, GLM-4.7-Flash (Q4_K_XL), 512-token prompt, 64 tokens</text>

    <text x="36" y="146" font-size="21" font-weight="600" fill="#eef3f8">Generation, tokens per second</text>
    <g font-size="18">
      <text x="36" y="190" fill="#eef3f8">am2Strata</text>
      <rect x="236" y="170" width="356" height="30" rx="8" fill="url(#bar)"/>
      <rect x="236" y="170" width="356" height="30" rx="8" fill="#5eead4" opacity=".35" filter="url(#glow)"/>
      <text x="604" y="192" font-weight="700" fill="#5eead4">8.9</text>
      <text x="36" y="240" fill="#a7b6c8">llama.cpp, mmap</text>
      <rect x="236" y="220" width="144" height="30" rx="8" fill="#3b4b6b"/>
      <text x="392" y="242" fill="#a7b6c8">3.6</text>
      <text x="36" y="290" fill="#a7b6c8">llama.cpp, default</text>
      <rect x="236" y="270" width="82" height="30" rx="8" fill="#3b4b6b"/>
      <text x="330" y="292" fill="#a7b6c8">2.05 · wrote ~98 GB of swap</text>
    </g>

    <text x="36" y="364" font-size="21" font-weight="600" fill="#eef3f8">Prompt, tokens per second</text>
    <g font-size="18">
      <text x="36" y="408" fill="#eef3f8">am2Strata</text>
      <rect x="236" y="388" width="338" height="30" rx="8" fill="url(#bar)"/>
      <text x="586" y="410" font-weight="700" fill="#5eead4">16.9</text>
      <text x="36" y="458" fill="#a7b6c8">llama.cpp, mmap</text>
      <rect x="236" y="438" width="346" height="30" rx="8" fill="#3b4b6b"/>
      <text x="594" y="460" fill="#a7b6c8">17.3</text>
      <text x="36" y="508" fill="#a7b6c8">llama.cpp, default</text>
      <rect x="236" y="488" width="228" height="30" rx="8" fill="#3b4b6b"/>
      <text x="476" y="510" fill="#a7b6c8">11.4</text>
    </g>
    <line x1="36" y1="550" x2="640" y2="550" stroke="#23314f" stroke-width="2"/>
    <text x="36" y="586" font-size="20" fill="#eef3f8"><tspan font-weight="700" fill="#5eead4">2.5x</tspan> llama.cpp's generation, no swapping;</text>
    <text x="36" y="614" font-size="20" fill="#eef3f8">llama.cpp's Metal path ran out of GPU memory.</text>
    <text x="36" y="642" font-size="14" fill="#7f8ea3">am2Strata at 8-10 threads; llama.cpp measured at 4 threads. Tokens checked against llama.cpp.</text>
  </g>
  <text x="64" y="920" font-size="16" fill="#7f8ea3">am2Strata · free and open source (MIT) · github.com/abhaymin/am2strata · numbers in docs/HYBRID-SPEED.md</text>
</svg>
