<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">am2Strata cluster: pairing a worker with a master</title>
  <desc id="d">Two machines. The master holds the main API key and talks to clients. The worker shows a 6-digit code; the master sends it once, they swap certificate pins and the worker mints a key for that master. After that the master reaches the worker only over mutual TLS 1.3 on the worker's cluster port.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fde"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a5b"/></marker>
  </defs>
  <rect width="1200" height="760" rx="22" fill="#f7f8fb"/>
  <text x="48" y="64" font-size="30" font-weight="700" fill="#151a24">A cluster in four steps</text>
  <text x="48" y="96" font-size="17" fill="#525b6b">One master that people and apps talk to; workers that answer for it. Keys are named, never shown.</text>

  <!-- master -->
  <rect x="48" y="130" width="420" height="300" rx="16" fill="#ffffff" stroke="#c9d1de" stroke-width="2"/>
  <text x="72" y="168" font-size="22" font-weight="700" fill="#151a24">Master</text>
  <text x="72" y="194" font-size="15" fill="#525b6b">e.g. the Linux PC with the big GPUs</text>
  <text x="72" y="232" font-size="15" font-weight="600" fill="#151a24">It keeps</text>
  <text x="72" y="258" font-size="15" fill="#2c3442">• its main API key  (run config "api_key")</text>
  <text x="72" y="282" font-size="15" fill="#2c3442">• node-tls.json  (its certificate = its pin)</text>
  <text x="72" y="306" font-size="15" fill="#2c3442">• cluster-workers.json: each worker's url,</text>
  <text x="88" y="328" font-size="15" fill="#2c3442">pin and the key it was given (0600)</text>
  <text x="72" y="366" font-size="15" font-weight="600" fill="#151a24">Clients use only the master</text>
  <text x="72" y="390" font-size="15" fill="#2c3442">their keys are never sent on to a worker</text>

  <!-- worker -->
  <rect x="732" y="130" width="420" height="300" rx="16" fill="#ffffff" stroke="#c9d1de" stroke-width="2"/>
  <text x="756" y="168" font-size="22" font-weight="700" fill="#151a24">Worker</text>
  <text x="756" y="194" font-size="15" fill="#525b6b">e.g. a Mac mini; "cluster": {"role": "worker"}</text>
  <text x="756" y="232" font-size="15" font-weight="600" fill="#151a24">It keeps</text>
  <text x="756" y="258" font-size="15" fill="#2c3442">• its own main API key (never leaves it)</text>
  <text x="756" y="282" font-size="15" fill="#2c3442">• node-key (ed25519) and node-tls.json</text>
  <text x="756" y="306" font-size="15" fill="#2c3442">• cluster-masters.json: each master's pin</text>
  <text x="772" y="328" font-size="15" fill="#2c3442">and only the HASH of its key (0600)</text>
  <text x="756" y="366" font-size="15" font-weight="600" fill="#151a24">Ports</text>
  <text x="756" y="390" font-size="15" fill="#2c3442">8000 API · 8443 cluster (TLS) · 8001 HTTPS</text>

  <!-- arrows between -->
  <line x1="480" y1="220" x2="720" y2="220" stroke="#2f6fde" stroke-width="3" marker-end="url(#ah)"/>
  <text x="600" y="206" font-size="14" text-anchor="middle" fill="#2f6fde" font-weight="600">pair: code + master's pin</text>
  <line x1="720" y1="268" x2="480" y2="268" stroke="#2f6fde" stroke-width="3" marker-end="url(#ah)"/>
  <text x="600" y="292" font-size="14" text-anchor="middle" fill="#2f6fde" font-weight="600">a new key + worker's pin</text>
  <line x1="480" y1="360" x2="720" y2="360" stroke="#1d8a5b" stroke-width="4" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="600" y="346" font-size="14" text-anchor="middle" fill="#1d8a5b" font-weight="700">mutual TLS 1.3, pins checked</text>
  <text x="600" y="384" font-size="13" text-anchor="middle" fill="#1d8a5b">chats, model list, queue</text>

  <!-- steps -->
  <g font-size="15" fill="#2c3442">
    <rect x="48" y="462" width="258" height="250" rx="14" fill="#eaf1fd"/>
    <circle cx="80" cy="494" r="17" fill="#2f6fde"/><text x="80" y="500" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="106" y="500" font-size="17" font-weight="700" fill="#151a24">Install on both</text>
    <text x="68" y="534">The one-line installer,</text>
    <text x="68" y="556">a model on each, and a</text>
    <text x="68" y="578">main "api_key" in each</text>
    <text x="68" y="600">run config (your own</text>
    <text x="68" y="622">long random value).</text>

    <rect x="326" y="462" width="258" height="250" rx="14" fill="#eaf1fd"/>
    <circle cx="358" cy="494" r="17" fill="#2f6fde"/><text x="358" y="500" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="384" y="500" font-size="17" font-weight="700" fill="#151a24">Make a worker</text>
    <text x="346" y="534">Add "cluster":</text>
    <text x="346" y="556">{"role": "worker",</text>
    <text x="346" y="578">"name": "macm4"}, start</text>
    <text x="346" y="600">it with --host 0.0.0.0.</text>
    <text x="346" y="622">It shows a 6-digit code</text>
    <text x="346" y="644">(new every 10 minutes).</text>

    <rect x="604" y="462" width="258" height="250" rx="14" fill="#eaf1fd"/>
    <circle cx="636" cy="494" r="17" fill="#2f6fde"/><text x="636" y="500" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="662" y="500" font-size="17" font-weight="700" fill="#151a24">Pair on the master</text>
    <text x="624" y="534">Settings › Cluster: the</text>
    <text x="624" y="556">worker "wants to join";</text>
    <text x="624" y="578">type its code, Pair.</text>
    <text x="624" y="600">Over a VPN: pair by its</text>
    <text x="624" y="622">address. 5 wrong codes</text>
    <text x="624" y="644">lock pairing 10 minutes.</text>

    <rect x="882" y="462" width="270" height="250" rx="14" fill="#e6f4ed"/>
    <circle cx="914" cy="494" r="17" fill="#1d8a5b"/><text x="914" y="500" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="940" y="500" font-size="17" font-weight="700" fill="#151a24">Use it</text>
    <text x="902" y="534">Ask the master for the</text>
    <text x="902" y="556">worker's model: the answer</text>
    <text x="902" y="578">carries x-strata-worker.</text>
    <text x="902" y="600">The master also hands a</text>
    <text x="902" y="622">worker overflow when it is</text>
    <text x="902" y="644">busy and the worker has</text>
    <text x="902" y="666">the same model idle.</text>
  </g>
  <text x="48" y="740" font-size="13" fill="#6a7383">Remove: Settings › Cluster › Remove (the worker forgets that master; its key stops working at once).</text>
</svg>
