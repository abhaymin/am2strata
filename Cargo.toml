[workspace]
resolver = "2"
members = [
    "crates/strata-tokenizer",
    "crates/strata-template",
    "crates/strata-protocol",
    "crates/strata-engine",
    "crates/strata-frontend",
    "crates/strata-gguf",
    "crates/strata-hub",
    "crates/strata-pack",
    "crates/strata-workshop",
    "crates/am2strata",
]

# strata-media (candle + CUDA kernels, mold's pinned dependency versions) is its own workspace with its own lock file:
#   cargo build --release --manifest-path crates/strata-media/Cargo.toml --features cuda
# strata-hybrid (the Rust engine) and strata-gpu (its CubeCL kernels) are another:
#   cargo build --release --manifest-path crates/strata-hybrid/Cargo.toml
exclude = ["crates/strata-media", "crates/strata-hybrid", "crates/strata-gpu"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fancy-regex = "0.14"
aho-corasick = "1"
minijinja = { version = "2", features = ["loop_controls", "preserve_order", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
regex = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
axum = { version = "0.8", features = ["multipart"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }

strata-tokenizer = { path = "crates/strata-tokenizer" }
strata-template = { path = "crates/strata-template" }
strata-protocol = { path = "crates/strata-protocol" }
strata-engine = { path = "crates/strata-engine" }
strata-gguf = { path = "crates/strata-gguf" }
strata-hub = { path = "crates/strata-hub" }
strata-pack = { path = "crates/strata-pack" }
strata-frontend = { path = "crates/strata-frontend" }

# strata-workshop (the mold candle fork — same pinned rev as strata-media, CPU build here: no cuda feature). autograd +
# AdamW prove the training path; llama/qwen/mistral defs load a frozen base when step 3 needs it.
candle-core = { package = "candle-core-mold", git = "https://github.com/utensils/candle.git", rev = "bf2cd29a791dbc053df826b4377d092c3809d17f" }
candle-nn = { package = "candle-nn-mold", git = "https://github.com/utensils/candle.git", rev = "bf2cd29a791dbc053df826b4377d092c3809d17f" }
# safetensors: write the tiny random fixtures; memmap2 reads them back without copying (merge/quantize steps reuse this)
safetensors = "0.8"
memmap2 = "0.9"
# prost: ONNX graph writer (step 7); only the proto, nothing compiled against ONNX Runtime
prost = "0.13"

[profile.release]
# the server is ~1% of request time (the engine is the rest): fast builds matter more than the last few percent
lto = false
codegen-units = 16
incremental = true
