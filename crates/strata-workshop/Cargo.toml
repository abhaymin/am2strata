[package]
name = "strata-workshop"
description = "Train, convert, quantize, and make models ready for am2Strata — all in Rust (no Python); the Workshop."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
safetensors.workspace = true
memmap2.workspace = true
serde_json.workspace = true
regex.workspace = true
prost.workspace = true
serde.workspace = true
thiserror.workspace = true
strata-pack.workspace = true
strata-gguf.workspace = true
# the model's own chat template renders the training conversations (the same renderer the server uses)
strata-template.workspace = true
# soup.yaml import (Soup configs are YAML); serde_yaml itself is unmaintained, this is its maintained fork
serde_norway = "0.9"
# tokenizers loads the fixture's tokenizer.json and tokenizes the pre-tokenizer probe string (the port of llama.cpp's
# get_vocab_base_pre); sha2 hashes that id list to look it up in llama.cpp's chkhsh table.
tokenizers = "0.21"
sha2 = "0.10"
half = "2"
clap.workspace = true
libc = "0.2"
# datagen: the server's own chat API (the loaded model writes the data)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[features]
# training on a GPU (`train --device metal` / `--device cuda`): candle's own backends; the CPU build stays the default
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
