[package]
name = "strata-workshop"
description = "Train, convert, quantize, and make models Strata-ready — all in Rust (no Python); the Workshop."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
safetensors.workspace = true
memmap2.workspace = true
serde_json.workspace = true
prost.workspace = true
serde.workspace = true
thiserror.workspace = true
strata-pack.workspace = true
strata-gguf.workspace = true
# tokenizers loads the fixture's tokenizer.json and tokenizes the pre-tokenizer probe string (the port of llama.cpp's
# get_vocab_base_pre); sha2 hashes that id list to look it up in llama.cpp's chkhsh table.
tokenizers = "0.21"
sha2 = "0.10"
half = "2"
