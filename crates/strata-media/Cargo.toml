[package]
name = "strata-media"
description = "am2Strata v2: image, video and voice generation in Rust (candle), with the strata placement techniques; built on mold's model implementations"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT AND Apache-2.0"

[features]
default = []
cuda = ["mold-ai-inference/cuda", "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
cudnn = ["mold-ai-inference/cudnn"]
# ONNX models (Chatterbox) through ONNX Runtime, loaded at run time: nothing is downloaded or linked at build time
onnx = ["dep:ort"]

[dependencies]
# ACE-Step's silence latent is a PyTorch zip (the patched zip below)
zip = { version = "8", default-features = false, features = ["deflate"] }
# mold (MIT; LTX-2 parts Apache-2.0): candle-based diffusion models, pinned to one commit
# features: mp4 - MP4 (H.264 by OpenH264) output for video, which also builds the FDK-AAC codec (see NOTICE)
mold-ai-inference = { git = "https://github.com/utensils/mold.git", rev = "bf0ea4a0b8276fb60e7ea0dbb431967f76ee035b", features = ["mp4"] }
mold-ai-core = { git = "https://github.com/utensils/mold.git", rev = "bf0ea4a0b8276fb60e7ea0dbb431967f76ee035b" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# RgbImage for chain_hold.rs (mold uses the same image 0.25)
image = { version = "0.25", default-features = false }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"
# speech (v2.3): candle's Whisper and Parler-TTS, at the revision mold pins; all pure Rust
candle-core = { package = "candle-core-mold", git = "https://github.com/utensils/candle.git", rev = "bf2cd29a791dbc053df826b4377d092c3809d17f" }
candle-nn = { package = "candle-nn-mold", git = "https://github.com/utensils/candle.git", rev = "bf2cd29a791dbc053df826b4377d092c3809d17f" }
candle-transformers = { package = "candle-transformers-mold", git = "https://github.com/utensils/candle.git", rev = "bf2cd29a791dbc053df826b4377d092c3809d17f" }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
# ONNX Runtime 1.23 (API 23), opened with dlopen when an ONNX model loads
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "std"], optional = true }
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[[bin]]
name = "am2strata-media"
path = "src/bin/am2strata-media.rs"

[workspace]
members = ["."]

[profile.release]
codegen-units = 16
incremental = true

# mold's own patch, which its candle fork needs (CUDA preflight and async-allocation calls): the same cudarc fork revision
[patch.crates-io]
cudarc = { git = "https://github.com/utensils/cudarc", rev = "9b3b1bc276bc27c3e99343ee82db7f99705b9ed5" }
# zip 9.2.2 for CVE-2026-115905: the forks above pin ^8.6 (vendor/zip/AM2STRATA.md)
zip = { path = "vendor/zip" }
