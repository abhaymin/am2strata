<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>am2Strata</title>
<link rel="icon" href="web/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="web/tokens.css">
<link rel="stylesheet" href="web/components.css">
<script>
  try {
    const mode = localStorage.getItem("strata.theme-mode") || "system";
    const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) {}
</script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--st-bg);color:var(--st-ink);font:var(--st-fs-base)/var(--st-lh-body) var(--st-font);overflow-x:hidden}
  main{max-width:920px;margin:0 auto;padding:16px}
  h1{font-size:var(--st-fs-xl);margin:8px 0 4px}
  h2{font-size:var(--st-fs-lg);margin:24px 0 8px}
  .muted{color:var(--st-ink-muted)}
  .small{font-size:var(--st-fs-sm)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px 12px;margin:8px 0}
  label{display:flex;flex-direction:column;gap:4px;font-size:var(--st-fs-sm);color:var(--st-ink-muted);min-width:0}
  label.inline{flex-direction:row;align-items:center;gap:6px}
  input,select{font:inherit;color:var(--st-ink);background:var(--st-surface-2,var(--st-bg));border:1px solid var(--st-line);border-radius:var(--st-r-sm);
    padding:8px 10px;width:100%;min-width:0}
  input[type=checkbox]{width:auto}
  .st-card{margin:10px 0;min-width:0}
  .st-btn{height:36px;padding:0 14px}
  .st-btn--secondary{background:var(--st-surface-2);color:var(--st-ink);border:1px solid var(--st-line)}
  .st-btn--danger{background:var(--st-danger-tint);color:var(--st-danger-text)}
  .msg{margin:8px 0;padding:8px 12px;border-radius:var(--st-r-sm);background:var(--st-info-tint);color:var(--st-info-text);overflow-wrap:anywhere}
  .msg.err{background:var(--st-danger-tint);color:var(--st-danger-text)}
  code,.mono{font-family:var(--st-font-mono);overflow-wrap:anywhere}
  .rule{border-top:1px solid var(--st-line-soft,var(--st-line));padding-top:8px;margin-top:8px}
  table{border-collapse:collapse;width:100%;font-size:var(--st-fs-sm)}
  td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--st-line-soft,var(--st-line));overflow-wrap:anywhere}
  .scroll{overflow-x:auto;max-width:100%}
  .chip{display:inline-block;padding:1px 8px;margin:2px;border-radius:var(--st-r-pill);background:var(--st-surface-2);font-size:var(--st-fs-xs);overflow-wrap:anywhere}
  .narrow{max-width:260px}
</style>
</head>
<body>
<main>
  <h1>Remote models</h1>
  <p class="muted small">OpenAI-compatible and Anthropic-compatible providers beside this server's models, and the mix that picks one per request. Only the server's own key opens these settings.</p>
  <div id="login" class="st-card">
    <label>The server's API key<input id="key" type="password" autocomplete="current-password" spellcheck="false"></label>
    <div class="row" style="margin-top:8px"><button class="st-btn st-btn--primary" id="open">Open</button><span id="login-msg" class="small"></span></div>
  </div>
  <div id="app" hidden></div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const fmt = (n) => Number(n || 0).toLocaleString();
  let key = "";
  try { key = JSON.parse(localStorage.getItem("strata.apikey") || '""') || ""; } catch (e) {}
  $("key").value = key;
  let state = null, draft = null, usage = null;

  async function api(method, path, body) {
    const h = {};
    if (key) h.Authorization = "Bearer " + key;
    if (body !== undefined) h["Content-Type"] = "application/json";
    const r = await fetch(path, {method, headers: h, body: body === undefined ? undefined : JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error((j.error && j.error.message) || `HTTP ${r.status}`); e.status = r.status; throw e; }
    return j;
  }

  function say(text, err) {
    const m = $("msg");
    if (!m) return;
    m.hidden = !text;
    m.className = "msg" + (err ? " err" : "");
    m.textContent = text || "";
  }

  // the block being edited, from the server's view
  function fromState(s) {
    const b = JSON.parse(JSON.stringify(s.block || {}));
    b.providers = b.providers || {};
    b.mix = b.mix || {default: "local", routes: []};
    b.mix.routes = b.mix.routes || [];
    b.mixes = b.mixes || {};
    for (const m of Object.values(b.mixes)) m.routes = m.routes || [];
    return b;
  }

  async function load() {
    try {
      state = await api("GET", "api/rtenai");
    } catch (e) {
      $("app").hidden = true;
      $("app").innerHTML = "";
      $("login").hidden = false;
      $("login-msg").textContent = e.status === 401 ? (key ? "That is not the server's own key." : "") : e.message;
      return;
    }
    $("login").hidden = true;
    $("app").hidden = false;
    draft = state.enabled ? fromState(state) : null;
    usage = null;
    render();
    if (state.enabled) {
      try { usage = await api("GET", "api/rtenai/usage?days=30"); renderUsage(); } catch (e) { /* shown as empty */ }
    }
  }

  function keyLine(p) {
    const k = ((state.providers || []).find((x) => x.name === p) || {}).key;
    if (!k) return '<span class="muted small">its key is set once it is saved</span>';
    if (k.set) return `<span class="st-badge st-badge--generating">key set</span> <span class="small muted">${esc(k.source)}${k.last4 ? ` · …${esc(k.last4)}` : ""}</span>`;
    return `<span class="st-badge st-badge--error">no key</span> <span class="small">${esc(k.error || "")}</span>`;
  }

  const tri = (v) => v === true ? "yes" : v === false ? "no" : "";
  function ruleHtml(mixName, i, r) {
    const w = r.when || {}, at = `data-mix="${esc(mixName)}" data-rule="${i}"`;
    const sel = (f) => `<select ${at} data-when="${f}">` +
      ["", "yes", "no"].map((o) => `<option value="${o}"${tri(w[f]) === o ? " selected" : ""}>${o || "any"}</option>`).join("") + `</select>`;
    return `<div class="rule"><div class="grid">
      <label>Longer than (tokens)<input type="number" min="0" ${at} data-when="tokens_over" value="${esc(w.tokens_over == null ? "" : w.tokens_over)}"></label>
      <label>Has pictures${sel("has_images")}</label>
      <label>Uses tools${sel("tools")}</label>
      <label>Local model busy${sel("local_busy")}</label>
      <label>Key (id, name, profile or owner)<input ${at} data-when="key" value="${esc(w.key || "")}"></label>
      <label>Then use<input list="targets" ${at} data-use="1" value="${esc(r.use || "")}"></label>
    </div><div class="row">
      <button class="st-btn st-btn--secondary" data-act="up" ${at}>Up</button>
      <button class="st-btn st-btn--secondary" data-act="down" ${at}>Down</button>
      <button class="st-btn st-btn--danger" data-act="rule-del" ${at}>Remove rule</button></div></div>`;
  }

  function mixHtml(name, m) {
    const title = name === "" ? "mix" : `mix/${name}`;
    return `<div class="st-card"><div class="row"><strong class="mono">${esc(title)}</strong>
      ${name === "" ? "" : `<button class="st-btn st-btn--danger" data-act="mix-del" data-mix="${esc(name)}">Remove mix</button>`}</div>
      <p class="muted small">Rules are tried in order; the first that holds picks the model. A remote model that fails before answering is followed once by the next rule that holds, or the default.</p>
      ${m.routes.map((r, i) => ruleHtml(name, i, r)).join("")}
      <div class="grid"><label>Otherwise (default)<input list="targets" data-mix="${esc(name)}" data-default="1" value="${esc(m.default || "local")}"></label></div>
      <button class="st-btn st-btn--secondary" data-act="rule-add" data-mix="${esc(name)}">Add rule</button></div>`;
  }

  function providerHtml(name, p) {
    const kinds = p.kinds || ["chat"], at = `data-p="${esc(name)}"`;
    return `<div class="st-card">
      <div class="row"><strong class="mono">${esc(name)}</strong>${keyLine(name)}</div>
      <div class="grid">
        <label>API<select ${at} data-f="kind"><option value="openai"${p.kind === "openai" ? " selected" : ""}>OpenAI-compatible</option>
          <option value="anthropic"${p.kind === "anthropic" ? " selected" : ""}>Anthropic</option></select></label>
        <label>Base URL<input ${at} data-f="base_url" value="${esc(p.base_url || "")}" placeholder="https://api.example.com/v1"></label>
        <label>Models (comma separated; empty: the provider's list)<input ${at} data-f="models" value="${esc((p.models || []).join(", "))}"></label>
        <label>At most at once<input type="number" min="1" max="64" ${at} data-f="max_concurrent" value="${esc(p.max_concurrent || 4)}"></label>
        <label>Key from (env:NAME or file:PATH; empty: the key set here)<input ${at} data-f="key" value="${esc(p.key || "")}" spellcheck="false"></label>
        <div class="row"><label class="inline"><input type="checkbox" ${at} data-kind="chat"${kinds.includes("chat") ? " checked" : ""}>chat</label>
          <label class="inline"><input type="checkbox" ${at} data-kind="image"${kinds.includes("image") ? " checked" : ""}>image</label></div>
      </div>
      <div class="grid"><label>Set key<input type="password" autocomplete="off" spellcheck="false" data-setkey="${esc(name)}" placeholder="kept on the server, never shown again"></label></div>
      <div class="row">
        <button class="st-btn st-btn--secondary" data-act="set-key" ${at}>Set key</button>
        <button class="st-btn st-btn--secondary" data-act="forget-key" ${at}>Forget key</button>
        <button class="st-btn st-btn--secondary" data-act="test" ${at}>Test</button>
        <button class="st-btn st-btn--danger" data-act="del" ${at}>Remove</button>
      </div><div class="small" data-test="${esc(name)}"></div></div>`;
  }

  function render() {
    const app = $("app");
    if (!state.enabled) {
      app.innerHTML = `<div id="msg" class="msg" hidden></div><div class="st-card"><p><strong>Remote models are off.</strong></p>
        <p class="muted small">Turning them on writes a "remote" block into ${esc(state.config || "the run config")}. Nothing changes for clients until providers are added.</p>
        <button class="st-btn st-btn--primary" data-act="on">Turn on</button></div>`;
      return;
    }
    const targets = ["local"];
    for (const p of state.providers || []) for (const m of p.models || []) targets.push(`${p.name}/${m}`);
    app.innerHTML = `<div id="msg" class="msg" hidden></div>
      <datalist id="targets">${targets.map((t) => `<option value="${esc(t)}">`).join("")}</datalist>
      <h2>Providers</h2>
      ${Object.entries(draft.providers).map(([n, p]) => providerHtml(n, p)).join("") || '<p class="muted">No providers yet.</p>'}
      <div class="row"><input id="new-name" class="narrow" placeholder="name (openai, groq, ...)">
        <button class="st-btn st-btn--secondary" data-act="add">Add provider</button></div>
      <h2>Mix</h2>
      <p class="muted small">Clients ask for the model <code>mix</code> (or <code>mix/&lt;name&gt;</code>). A target is <code>local</code>, a local model id, or <code>provider/model</code>.</p>
      ${mixHtml("", draft.mix)}
      ${Object.entries(draft.mixes).map(([n, m]) => mixHtml(n, m)).join("")}
      <div class="row"><input id="new-mix" class="narrow" placeholder="named mix (code, long, ...)">
        <button class="st-btn st-btn--secondary" data-act="mix-add">Add named mix</button></div>
      <div class="row" style="margin:16px 0"><button class="st-btn st-btn--primary" data-act="save">Save</button>
        <button class="st-btn st-btn--danger" data-act="off">Turn off</button>
        <span class="muted small">Saved into ${esc(state.config || "the run config")}; keys never go there.</span></div>
      <h2>Use</h2><div id="usage" class="muted small">Reading the usage counts…</div>`;
    renderUsage();
  }

  function renderUsage() {
    const el = $("usage");
    if (!el || !usage) return;
    const rows = Object.entries(usage.providers || {});
    el.innerHTML = rows.map(([name, p]) => {
      const days = (p.by_day || []).slice().reverse();
      return `<div class="st-card"><div class="row"><strong class="mono">${esc(name)}</strong>
        <span class="small">${fmt(p.requests)} requests · ${fmt(p.prompt_tokens)} prompt · ${fmt(p.completion_tokens)} completion · ${fmt(p.cached_tokens)} cached tokens (${esc(usage.days)} days)</span></div>
        ${days.length ? `<div class="scroll"><table><tr><th>Day</th><th>Model</th><th>Requests</th><th>Prompt</th><th>Completion</th></tr>` +
          days.map((d) => d.models.map((m) => `<tr><td>${esc(d.day)}</td><td class="mono">${esc(m.model)}</td><td>${fmt(m.requests)}</td><td>${fmt(m.prompt_tokens)}</td><td>${fmt(m.completion_tokens)}</td></tr>`).join("")).join("") +
          `</table></div>` : '<p class="muted small">Not used yet.</p>'}</div>`;
    }).join("") || '<p class="muted small">No providers.</p>';
  }

  // the form into the draft (before any button acts on it)
  function collect() {
    if (!draft) return;
    for (const el of document.querySelectorAll("[data-p][data-f]")) {
      const p = draft.providers[el.dataset.p];
      if (!p) continue;
      const f = el.dataset.f, v = el.value.trim();
      if (f === "models") p.models = v ? v.split(",").map((x) => x.trim()).filter(Boolean) : [];
      else if (f === "max_concurrent") p.max_concurrent = Math.max(1, Math.min(64, parseInt(v, 10) || 4));
      else p[f] = v;
    }
    for (const name of Object.keys(draft.providers)) {
      const kinds = [...document.querySelectorAll("[data-p][data-kind]")].filter((c) => c.dataset.p === name && c.checked).map((c) => c.dataset.kind);
      draft.providers[name].kinds = kinds.length ? kinds : ["chat"];
    }
    const mixOf = (n) => n === "" ? draft.mix : draft.mixes[n];
    for (const el of document.querySelectorAll("[data-mix][data-default]")) { const m = mixOf(el.dataset.mix); if (m) m.default = el.value.trim() || "local"; }
    for (const el of document.querySelectorAll("[data-mix][data-rule]")) {
      if (el.tagName === "BUTTON") continue;
      const m = mixOf(el.dataset.mix), r = m && m.routes[+el.dataset.rule];
      if (!r) continue;
      r.when = r.when || {};
      if (el.dataset.use) { r.use = el.value.trim(); continue; }
      const f = el.dataset.when, v = el.value.trim();
      if (f === "tokens_over") { if (v === "") delete r.when[f]; else r.when[f] = Math.max(0, parseInt(v, 10) || 0); }
      else if (f === "key") { if (v) r.when.key = v; else delete r.when.key; }
      else if (f) { if (v === "yes") r.when[f] = true; else if (v === "no") r.when[f] = false; else delete r.when[f]; }
    }
  }

  async function save(block) {
    try {
      state = await api("POST", "api/rtenai", {remote: block});
      draft = state.enabled ? fromState(state) : null;
      render();
      say(block ? "Saved: used from now on." : "Remote models are off.");
    } catch (e) { say(e.message, true); }
  }

  $("app").addEventListener("click", async (ev) => {
    const b = ev.target.closest("button[data-act]");
    if (!b) return;
    collect();
    const act = b.dataset.act, p = b.dataset.p, mixName = b.dataset.mix;
    const mix = !draft || mixName === undefined ? null : mixName === "" ? draft.mix : draft.mixes[mixName];
    const i = +b.dataset.rule;
    if (act === "on") return save({providers: {}, mix: {default: "local", routes: []}});
    if (act === "off") { if (confirm("Turn remote models off? The run config's remote block is removed.")) save(null); return; }
    if (act === "save") return save(draft);
    if (act === "add") {
      const n = $("new-name").value.trim();
      if (!/^[A-Za-z0-9_-]{1,40}$/.test(n) || draft.providers[n]) { say("A new provider needs a name of letters, digits, - and _.", true); return; }
      draft.providers[n] = {kind: "openai", base_url: "", models: [], max_concurrent: 4, kinds: ["chat"], key: ""};
      render(); say("Fill it in, then Save; its key is set once it is saved."); return;
    }
    if (act === "del") { delete draft.providers[p]; render(); say("Removed from the form: Save to keep it so."); return; }
    if (act === "mix-add") {
      const n = $("new-mix").value.trim();
      if (!/^[A-Za-z0-9_-]{1,40}$/.test(n) || draft.mixes[n]) { say("A named mix needs a name of letters, digits, - and _.", true); return; }
      draft.mixes[n] = {default: "local", routes: []}; render(); return;
    }
    if (act === "mix-del") { delete draft.mixes[mixName]; render(); return; }
    if (act === "rule-add" && mix) { mix.routes.push({when: {}, use: "local"}); render(); return; }
    if (act === "rule-del" && mix) { mix.routes.splice(i, 1); render(); return; }
    if ((act === "up" || act === "down") && mix) {
      const j = act === "up" ? i - 1 : i + 1;
      if (j >= 0 && j < mix.routes.length) [mix.routes[i], mix.routes[j]] = [mix.routes[j], mix.routes[i]];
      render(); return;
    }
    const input = [...document.querySelectorAll("[data-setkey]")].find((x) => x.dataset.setkey === p);
    const out = [...document.querySelectorAll("[data-test]")].find((x) => x.dataset.test === p);
    if (act === "set-key") {
      const k = input ? input.value.trim() : "";
      if (!k) { say("Type the key first.", true); return; }
      try { await api("POST", `api/rtenai/keys/${encodeURIComponent(p)}`, {key: k}); input.value = ""; state = await api("GET", "api/rtenai"); render(); say(`The key of ${p} is set.`); }
      catch (e) { say(e.message, true); }
      return;
    }
    if (act === "forget-key") {
      try { await api("DELETE", `api/rtenai/keys/${encodeURIComponent(p)}`); state = await api("GET", "api/rtenai"); render(); say(`The key set here for ${p} is forgotten.`); }
      catch (e) { say(e.message, true); }
      return;
    }
    if (act === "test" && out) {
      out.textContent = "Asking the provider…";
      try {
        const t = await api("POST", `api/rtenai/test/${encodeURIComponent(p)}`);
        out.innerHTML = t.ok ? `${t.models.length} models: ${t.models.slice(0, 60).map((m) => `<span class="chip">${esc(m)}</span>`).join("")}`
                             : `<span class="st-badge st-badge--error">failed</span> ${esc(t.error)}`;
      } catch (e) { out.textContent = e.message; }
    }
  });

  $("open").onclick = () => {
    key = $("key").value.trim();
    try { localStorage.setItem("strata.apikey", JSON.stringify(key)); } catch (e) {}
    load();
  };
  $("key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("open").onclick(); });
  load();
})();
</script>
</body>
</html>
