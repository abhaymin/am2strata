[package]
name = "am2strata"
description = "am2Strata: OpenAI/Anthropic-compatible server for the PolyStrata engines"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strata-tokenizer.workspace = true
strata-template.workspace = true
strata-protocol.workspace = true
strata-engine.workspace = true
strata-frontend.workspace = true
strata-gguf.workspace = true
strata-hub.workspace = true
strata-pack.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
axum.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
base64 = "0.22"
sha2 = "0.10"
jsonschema = { version = "0.30", default-features = false }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
# web_search / fetch_url: DuckDuckGo's HTML results and the text of a page (pure Rust, html5ever)
scraper = "0.20"
ego-tree = "0.6.3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
jsonschema = { version = "0.30", default-features = false }
