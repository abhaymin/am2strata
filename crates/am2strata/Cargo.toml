[package]
name = "am2strata"
description = "am2Strata: OpenAI/Anthropic-compatible server for the PolyStrata engines"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strata-tokenizer.workspace = true
strata-template.workspace = true
strata-protocol.workspace = true
strata-engine.workspace = true
strata-frontend.workspace = true
strata-gguf.workspace = true
strata-hub.workspace = true
strata-pack.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
axum.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "stream"] }
base64 = "0.22"
sha2 = "0.10"
# clusters: the node's ed25519 identity, random pairing codes and keys, LAN discovery (cluster.rs)
ed25519-dalek = "2"
rand = "0.8"
mdns-sd = "0.13"
# cluster traffic encrypted: mutual TLS 1.3 with the paired nodes' self-signed certificates pinned (cluster_tls.rs);
# rustls and tokio-rustls are already in the build through reqwest (ring), rcgen makes the certificates
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"
# HTTPS status: a certificate's names, issuer and expiry (server_tls.rs)
x509-parser = "0.16"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service", "http1", "http2"] }
jsonschema = { version = "0.30", default-features = false }
# the live channel (live_channel.rs): the router called in-process for a request sent over the WebSocket (tower is
# already in the build through axum), and `am2strata-run live`, a WebSocket client (the tungstenite axum uses; wss
# through the rustls above, trusting the public roots reqwest already brings, or a certificate given with --cert)
tower = { version = "0.5", default-features = false, features = ["util"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
webpki-roots = "1"
tower-http = { version = "0.6", features = ["fs", "set-header", "catch-panic"] }
# web_search / fetch_url: DuckDuckGo's HTML results and the text of a page (pure Rust, html5ever)
scraper = "0.20"
ego-tree = "0.6.3"
# browser computer use: Chrome's DevTools protocol, pure Rust
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
libc = "0.2"
# an edit's default size: the dimensions of the uploaded image
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
jsonschema = { version = "0.30", default-features = false }
# web_assets: check the client JS this box serves, since it has no node to parse it (no duplicate top-level declarations)
regex = "1"

# the Computer tab: frames from the sandbox's own X display and the operator's input into it (pure-Rust X client)
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
