# Runs on Linux only, and only when code changes: Windows and macOS build in release.yml, on a version tag.
name: CI
on:
  push:
    branches: [main]
    paths: ["crates/**", "!crates/**/*.md", "Cargo.toml", "Cargo.lock", "golden/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["crates/**", "!crates/**/*.md", "Cargo.toml", "Cargo.lock", "golden/**", ".github/workflows/ci.yml"]

# A newer push replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/strata-hybrid
          # pull requests read the cache and do not add to it
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked --workspace
      - run: cargo test --locked --manifest-path crates/strata-hybrid/Cargo.toml --no-default-features --features gpu --bin am2strata-hybrid

  # The regression suite by name (docs/REGRESSION.md): the route contract table and its guard, the golden response
  # shapes, one test per bug class fixed before, and the live runner against a test server. The `test` job runs them
  # too (with everything else); this job says plainly when it is a REGRESSION that failed, and checks that the tests
  # wrote nothing into the repository.
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: route contracts, golden shapes, bug regressions, the live runner
        run: cargo test --locked -p am2strata --test regression_api --test regression_shapes --test regression_bugs --test regression_runner -- --test-threads=4
      - name: regressions beside the code they guard
        run: |
          cargo test --locked -p am2strata --bin am2strata regress
          cargo test --locked -p strata-workshop --lib regress
      - name: the tests wrote nothing into the repository
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  # Every platform a release is built for (release.yml) except the Linux one above. The v0.1.7 release check failed on
  # macOS and Windows because `computer/backend.rs`/`engine.rs` used Linux-only types (`LinuxBackend`, `SandboxDesktop`) at
  # module scope, so code that compiled only on Linux could merge. This checks that everything a download carries compiles
  # on each of them before a merge: the workspace with its tests, and the Rust engine as the releases build it.
  check-other-os:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false      # one platform's failure does not hide another's: a run shows everything to fix at once
      matrix:
        include:
          # engine: the Rust engine's features. `gpu` (weights on any GPU through wgpu) pulls in CubeCL's CPU runtime, whose
          # build downloads a prebuilt LLVM from tracel-ai/tracel-llvm v20.1.4-7. That release has no macOS x64 and no
          # Windows Arm64 bundle, and its Linux Arm64 bundle does not unpack where the build expects it. So those three
          # get the engine without `gpu`: it runs models on the CPU, and --devices is refused there.
          - { os: ubuntu-22.04-arm, label: linux-arm64, engine: "" }
          - { os: macos-15, label: macos-arm64, engine: "--features gpu" }
          - { os: macos-15-intel, label: macos-x86_64, engine: "" }
          - { os: windows-2022, label: windows-x86_64, engine: "--features gpu" }
          - { os: windows-11-arm, label: windows-arm64, engine: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/strata-hybrid
          # pull requests read the cache and do not add to it
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # checked for compilation, not run (the tests run on Linux above, and everywhere in release.yml): the OS-specific
      # code is all gated on `target_os` / `unix` / `windows`.
      - run: cargo check --locked --workspace --tests
      - run: cargo check --locked --manifest-path crates/strata-hybrid/Cargo.toml --no-default-features ${{ matrix.engine }}
