# Builds and tests Linux, Windows and macOS (x86_64 and Arm64 each: six downloads) on a version tag, and leaves a draft
# release (notes from docs/releases/<tag>.md, the downloads and the installers) for a person to publish.
#   git tag v0.2.0 && git push origin v0.2.0
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # builds and tests all six, publishes nothing: a check before tagging

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  build:
    strategy:
      fail-fast: false      # one platform's failure does not hide another's: a run shows everything to fix at once
      matrix:
        include:
          # engine: the Rust engine's features. `gpu` (weights on any GPU through wgpu) pulls in CubeCL's CPU runtime, whose
          # build downloads a prebuilt LLVM from tracel-ai/tracel-llvm v20.1.4-7. That release has no macOS x64 and no
          # Windows Arm64 bundle, and its Linux Arm64 bundle does not unpack where the build expects it. So those three
          # get the engine without `gpu`: it runs models on the CPU, and --devices is refused there.
          # the oldest supported Ubuntu: a binary built there also runs on newer Linux, not the other way round
          - { os: ubuntu-22.04, label: linux-x86_64, engine: "--features gpu" }
          - { os: ubuntu-22.04-arm, label: linux-arm64, engine: "" }
          - { os: macos-15, label: macos-arm64, engine: "--features gpu" }
          # Intel Macs: GitHub's own Intel runner, so the tests run on the processor the download is for. A cross-compile
          # on the Arm runner (--target x86_64-apple-darwin, then deploy/package-portable.sh macos-x86_64
          # x86_64-apple-darwin) is the way once GitHub retires its Intel runners.
          - { os: macos-15-intel, label: macos-x86_64, engine: "" }
          - { os: windows-2022, label: windows-x86_64, engine: "--features gpu" }
          - { os: windows-11-arm, label: windows-arm64, engine: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/strata-hybrid
      # what PDFs and the browser tool need, so their tests run here instead of skipping
      - name: Poppler and Chrome for the tests
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get install -y --no-install-recommends poppler-utils >/dev/null ;;
            macOS) brew install --quiet poppler ;;
            Windows)
              bash deploy/fetch-poppler-windows.sh "$RUNNER_TEMP"
              cygpath -w "$RUNNER_TEMP/poppler/bin" >> "$GITHUB_PATH" ;;
          esac
          if [ "${{ matrix.label }}" = linux-arm64 ]; then
            # Chrome for Testing has no Linux Arm64 build: the browser tests skip there (poppler is installed above)
            exit 0
          fi
          exe=$(bash deploy/fetch-chrome.sh "$RUNNER_TEMP/browser" | tail -1)
          [ "$RUNNER_OS" = Windows ] && exe=$(cygpath -w "$exe")
          echo "AM2STRATA_TEST_CHROME=$exe" >> "$GITHUB_ENV"
          echo "AM2STRATA_TEST_TOOLS=1" >> "$GITHUB_ENV"     # a missing tool fails the test instead of skipping it
      - run: cargo test --release --locked --workspace --no-fail-fast
      - run: cargo build --release --locked -p am2strata -p strata-workshop --bin am2strata --bin am2strata-run --bin am2strata-workshop
      - run: cargo build --release --locked --manifest-path crates/strata-hybrid/Cargo.toml --no-default-features ${{ matrix.engine }}
      - run: bash deploy/package-portable.sh ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*.*
          retention-days: 3
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=docs/releases/$GITHUB_REF_NAME.md
          gh api "repos/$GITHUB_REPOSITORY/contents/$notes?ref=$GITHUB_REF_NAME" -q .content | base64 -d > notes.md || echo "" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --notes-file notes.md --generate-notes
