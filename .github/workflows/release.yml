# Builds for Linux, Windows and macOS on a version tag, and leaves a draft release for a person to publish.
#   git tag v0.2.0 && git push origin v0.2.0
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # builds and tests all three, publishes nothing: a check before tagging

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  build:
    strategy:
      fail-fast: true       # one platform failing stops the others, rather than finishing work that cannot ship
      matrix:
        include:
          # the oldest supported Ubuntu: a binary built there also runs on newer Linux, not the other way round
          - { os: ubuntu-22.04, label: linux-x86_64 }
          - { os: macos-14, label: macos-arm64 }
          - { os: windows-2022, label: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/strata-hybrid
      - run: cargo test --release --locked --workspace
      - run: cargo build --release --locked -p am2strata
      - run: cargo build --release --locked --manifest-path crates/strata-hybrid/Cargo.toml --no-default-features --features gpu
      - run: bash deploy/package-portable.sh ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*.*
          retention-days: 3
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes
