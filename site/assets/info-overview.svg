<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="Outfit, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">am2Strata: what is in it</title>
<desc id="d">Compatible APIs: OpenAI, Anthropic, Responses and Gemini endpoints Tools, images, MCP servers; Bigger than RAM: Hot experts in RAM, cold on SSD 2.5x llama.cpp&#x27;s generation on a 16 GB Mac (17.5 GB model); Cluster: Pair a Mac or PC by 6-digit code Small models on workers answer as expert &#x27;brains&#x27;; Browser use: Scrape tables into datasets Fill forms, ask before sending From chat, CLI and MCP; Web app: Chat with canvas, Python, whiteboard and flows Monitor: speed, GPUs, queue; Workshop: Hugging Face model to GGUF Quantize, merge LoRA, install Training data from documents; Sandbox VM: Computer use in its own VM The agent is root inside; your PC is untouched; Computer tab: Watch the agent&#x27;s desktop Take over with mouse and keys Rules decide what it may do; Coding agents: Connect Claude Code, Codex, opencode and more to your own models, one command; Media: Songs in 50+ languages Voices, images, video Speech to text; Secure by default: HTTPS and wss; Tailscale certs API keys with limits and expiry Usage per key and per model; Install and verify: One line: Linux, macOS, Windows x64 and Arm, checksum verified doctor shows what each needs</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1326"/><stop offset="1" stop-color="#101c38"/></linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14213f"/><stop offset="1" stop-color="#0f1931"/></linearGradient></defs>
