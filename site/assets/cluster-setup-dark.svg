<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Outfit, Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">am2Strata cluster: pairing a worker with a master</title>
<desc id="d">Two machines. The master holds the main API key and talks to clients; it keeps node-tls.json and cluster-workers.json. The worker keeps its own key, node-key and node-tls.json, and cluster-masters.json with only the hash of the key it gave. Steps: 1 install on both with a main api_key each; 2 make a worker with cluster role worker, started on 0.0.0.0, which shows a 6-digit code new every 10 minutes; 3 pair on the master in Settings, Cluster by typing the code (5 wrong codes lock pairing for 10 minutes); 4 use it: the master answers with the worker&#x27;s model and hands it overflow. After pairing, every connection is mutual TLS 1.3 with pinned certificates on port 8443. Remove a worker in Settings, Cluster, Remove.</desc>
<rect width="1200" height="800" rx="28" fill="#1e1e2e"/>
<text x="48" y="64" font-size="30" font-weight="700" text-anchor="start" fill="#cdd6f4">A cluster in four steps</text>
<text x="48" y="96" font-size="17" font-weight="400" text-anchor="start" fill="#b1b7cf">One master that people and apps talk to; workers that answer for it. Keys are named here, never shown.</text>
<g transform="translate(48 128)"><rect width="430" height="296" rx="16" fill="#28283b" stroke="#45475a" stroke-width="2"/>
<text x="24" y="40" font-size="24" font-weight="700" text-anchor="start" fill="#cdd6f4">Master</text>
<text x="24" y="66" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">e.g. the Linux PC with the big GPUs</text>
<text x="24" y="104" font-size="16" font-weight="700" text-anchor="start" fill="#cdd6f4">It keeps</text>
<text x="24" y="130" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">• its main API key (run config &quot;api_key&quot;)</text>
<text x="24" y="154" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">• node-tls.json (its certificate = its pin)</text>
<text x="24" y="178" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">• cluster-workers.json: each worker&#x27;s url,</text>
<text x="24" y="202" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">   pin and the key it was given (0600)</text>
<text x="24" y="240" font-size="16" font-weight="700" text-anchor="start" fill="#cdd6f4">Clients use only the master</text>
<text x="24" y="264" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">their keys are never sent on to a worker</text>
</g>
<g transform="translate(722 128)"><rect width="430" height="296" rx="16" fill="#28283b" stroke="#45475a" stroke-width="2"/>
<text x="24" y="40" font-size="24" font-weight="700" text-anchor="start" fill="#cdd6f4">Worker</text>
<text x="24" y="66" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">e.g. a Mac mini; &quot;cluster&quot;: {&quot;role&quot;: &quot;worker&quot;}</text>
<text x="24" y="104" font-size="16" font-weight="700" text-anchor="start" fill="#cdd6f4">It keeps</text>
<text x="24" y="130" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">• its own main API key (never leaves it)</text>
<text x="24" y="154" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">• node-key (ed25519) and node-tls.json</text>
<text x="24" y="178" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">• cluster-masters.json: each master&#x27;s pin</text>
<text x="24" y="202" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">   and only the HASH of its key (0600)</text>
<text x="24" y="240" font-size="16" font-weight="700" text-anchor="start" fill="#cdd6f4">Ports</text>
<text x="24" y="264" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">8000 API · 8443 cluster (TLS) · 8001 HTTPS</text>
</g>
<line x1="488" y1="196" x2="704" y2="196" stroke="#89b4fa" stroke-width="3"/><path d="M700 188 L714 196 L700 204 z" fill="#89b4fa"/>
<text x="600" y="184" font-size="14" font-weight="600" text-anchor="middle" fill="#90b9fa">pair: code + master&#x27;s pin</text>
<line x1="712" y1="262" x2="496" y2="262" stroke="#a6e3a1" stroke-width="3"/><path d="M500 254 L486 262 L500 270 z" fill="#a6e3a1"/>
<text x="600" y="250" font-size="14" font-weight="600" text-anchor="middle" fill="#a6e3a1">a new key + worker&#x27;s pin</text>
<line x1="496" y1="330" x2="704" y2="330" stroke="#94e2d5" stroke-width="5"/><path d="M700 320 L716 330 L700 340 z" fill="#94e2d5"/><path d="M500 320 L484 330 L500 340 z" fill="#94e2d5"/>
<text x="600" y="316" font-size="14" font-weight="700" text-anchor="middle" fill="#94e2d5">mutual TLS 1.3, pins checked</text>
<text x="600" y="358" font-size="14" font-weight="400" text-anchor="middle" fill="#b1b7cf">chats, model list, queue</text>
<g transform="translate(48 452)"><rect width="262" height="268" rx="14" fill="#28283b" stroke="#45475a" stroke-width="2"/><circle cx="34" cy="38" r="17" fill="#94e2d5"/><text x="34" y="44" font-size="17" font-weight="700" text-anchor="middle" fill="#11111b">1</text><text x="62" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#cdd6f4">Install on both</text><text x="20" y="84" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">The one-line installer,</text><text x="20" y="110" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">a model on each, and a</text><text x="20" y="136" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">main &quot;api_key&quot; in each</text><text x="20" y="162" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">run config (your own</text><text x="20" y="188" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">long random value).</text></g>
<g transform="translate(326 452)"><rect width="262" height="268" rx="14" fill="#28283b" stroke="#45475a" stroke-width="2"/><circle cx="34" cy="38" r="17" fill="#89b4fa"/><text x="34" y="44" font-size="17" font-weight="700" text-anchor="middle" fill="#11111b">2</text><text x="62" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#cdd6f4">Make a worker</text><text x="20" y="84" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">Add &quot;cluster&quot;:</text><text x="20" y="110" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">{&quot;role&quot;: &quot;worker&quot;,</text><text x="20" y="136" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">&quot;name&quot;: &quot;macm4&quot;}; start</text><text x="20" y="162" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">it with --host 0.0.0.0.</text><text x="20" y="188" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">It shows a 6-digit code</text><text x="20" y="214" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">(new every 10 minutes).</text></g>
<g transform="translate(604 452)"><rect width="262" height="268" rx="14" fill="#28283b" stroke="#45475a" stroke-width="2"/><circle cx="34" cy="38" r="17" fill="#cba6f7"/><text x="34" y="44" font-size="17" font-weight="700" text-anchor="middle" fill="#11111b">3</text><text x="62" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#cdd6f4">Pair on the master</text><text x="20" y="84" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">Settings › Cluster: the</text><text x="20" y="110" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">worker &quot;wants to join&quot;;</text><text x="20" y="136" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">type its code, Pair.</text><text x="20" y="162" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">Over a VPN: pair by its</text><text x="20" y="188" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">address. 5 wrong codes</text><text x="20" y="214" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">lock pairing 10 minutes.</text></g>
<g transform="translate(882 452)"><rect width="262" height="268" rx="14" fill="#28283b" stroke="#45475a" stroke-width="2"/><circle cx="34" cy="38" r="17" fill="#f5c2e7"/><text x="34" y="44" font-size="17" font-weight="700" text-anchor="middle" fill="#11111b">4</text><text x="62" y="44" font-size="19" font-weight="700" text-anchor="start" fill="#cdd6f4">Use it</text><text x="20" y="84" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">Ask the master for the</text><text x="20" y="110" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">worker&#x27;s model: the answer</text><text x="20" y="136" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">carries x-strata-worker.</text><text x="20" y="162" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">The master also hands a</text><text x="20" y="188" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">worker overflow when busy</text><text x="20" y="214" font-size="16" font-weight="400" text-anchor="start" fill="#b1b7cf">and it has the model idle.</text></g>
<text x="48" y="764" font-size="15" font-weight="400" text-anchor="start" fill="#b1b7cf">Remove: Settings › Cluster › Remove (the worker forgets that master; its key stops working at once).</text>
</svg>
